[project]
name = "personal-deadline-management"
version = "0.1.0"
description = "Local personal planning, learning, document retrieval and Codex MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "mcp>=1.12,<2",
  "pypdf>=5",
  "python-docx>=1.1",
  "python-dateutil>=2.9",
  "numpy>=2",
  "google-auth-oauthlib>=1.2",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "platformdirs>=4,<5",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4", "torch>=2.5"]

[project.scripts]
pdm = "backend.cli:main"
pdm-mcp = "backend.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.14,<1"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"resources/office-runtime.json" = "backend/resources/office-runtime.json"

[tool.hatch.build.targets.sdist]
include = ["backend", "resources/*.example.json", "resources/office-runtime.json", "frontend/src", "frontend/public", "frontend/*.html", "frontend/*.json", "frontend/*.yaml", "frontend/*.ts", "frontend/.prettierrc.json", "frontend/.prettierignore", "frontend/tests", "frontend/e2e", "scripts", "tests", "docs", ".github", ".env.example", ".python-version", ".node-version", ".editorconfig", ".gitattributes", ".gitignore", "*.md", "alembic.ini", "pyproject.toml", "uv.lock", "LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

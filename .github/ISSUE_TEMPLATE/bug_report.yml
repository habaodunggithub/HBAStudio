name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: "Please remove personal records, account details, OAuth JSON and tokens. Report vulnerabilities privately as described in SECURITY.md. English or Vietnamese is welcome."
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal example without personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, revision/version, Python/Node/pnpm versions, optional features enabled.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Check attachments for private paths, account identifiers and tokens before submitting.
